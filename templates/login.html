<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acceso — Portal Importadora Uziel</title>
    <style>
        /* ================================================================
           RESET Y BASE
        ================================================================ */
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background: linear-gradient(135deg, #001f3f 0%, #003a6e 60%, #00518a 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* ================================================================
           TARJETA DE LOGIN
        ================================================================ */
        .login-card {
            background: #ffffff;
            padding: 48px 40px 40px;
            border-radius: 16px;
            box-shadow: 0 24px 60px rgba(0, 0, 0, 0.35);
            width: 100%;
            max-width: 380px;
            text-align: center;
        }

        .login-card .logo-icon {
            font-size: 40px;
            margin-bottom: 8px;
        }

        .login-card h1 {
            color: #001f3f;
            font-size: 22px;
            font-weight: 700;
            margin-bottom: 4px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .login-card .subtitulo {
            color: #7a8aaa;
            font-size: 13px;
            margin-bottom: 32px;
        }

        /* ================================================================
           FORMULARIO
        ================================================================ */
        .campo {
            text-align: left;
            margin-bottom: 20px;
        }

        .campo label {
            display: block;
            font-size: 12px;
            font-weight: 600;
            color: #5a6a88;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 6px;
        }

        .campo input {
            width: 100%;
            padding: 12px 14px;
            border: 1.5px solid #dde2ef;
            border-radius: 8px;
            font-size: 15px;
            color: #1a2540;
            background-color: #f7f9fc;
            transition: border-color 0.2s, box-shadow 0.2s;
            outline: none;
        }

        .campo input:focus {
            border-color: #003a6e;
            background-color: #fff;
            box-shadow: 0 0 0 3px rgba(0, 58, 110, 0.12);
        }

        /* ================================================================
           BOTÓN PRINCIPAL
        ================================================================ */
        .btn-ingresar {
            width: 100%;
            background: linear-gradient(135deg, #27AE60, #1e8449);
            color: white;
            border: none;
            padding: 14px;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            transition: opacity 0.2s, transform 0.15s;
            margin-top: 8px;
        }

        .btn-ingresar:hover {
            opacity: 0.9;
            transform: translateY(-1px);
        }

        .btn-ingresar:active {
            transform: translateY(0);
        }

        /* ================================================================
           MENSAJES FLASH
        ================================================================ */
        .mensaje {
            padding: 12px 16px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-size: 14px;
            font-weight: 500;
            text-align: left;
        }

        .mensaje-error {
            background-color: #fef2f2;
            color: #c0392b;
            border-left: 4px solid #E74C3C;
        }

        .mensaje-exito {
            background-color: #f0fdf4;
            color: #1e7a47;
            border-left: 4px solid #27AE60;
        }

        /* ================================================================
           PIE
        ================================================================ */
        .footer-texto {
            margin-top: 24px;
            font-size: 12px;
            color: #a0aabf;
        }
    </style>
</head>
<body>

    <div class="login-card">

        <div class="logo-icon">📦</div>
        <h1>Portal Uziel</h1>
        <p class="subtitulo">Sistema de Información de Marketing</p>

        <!-- Mensajes de retroalimentación (Flash Messages) -->
        {% with messages = get_flashed_messages(with_categories=true) %}
          {% if messages %}
            {% for category, message in messages %}
              <div class="mensaje {% if category == 'exito' %}mensaje-exito{% else %}mensaje-error{% endif %}">
                {{ message }}
              </div>
            {% endfor %}
          {% endif %}
        {% endwith %}

        <!-- Formulario de inicio de sesión -->
        <form method="POST" autocomplete="on">
            <div class="campo">
                <label for="username">Usuario</label>
                <input
                    type="text"
                    id="username"
                    name="username"
                    placeholder="Ej: jefe"
                    autocomplete="username"
                    required
                    autofocus
                >
            </div>
            <div class="campo">
                <label for="password">Contraseña</label>
                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="••••••••"
                    autocomplete="current-password"
                    required
                >
            </div>
            <button type="submit" class="btn-ingresar">🔐 Ingresar al Sistema</button>
        </form>

        <p class="footer-texto">Importadora Uziel C.A. &copy; 2026</p>
    </div>

</body>
</html>
