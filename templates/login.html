<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acceso — Importadora Uziel</title>
    <style>
        :root {
            --primary: #0ea5e9;
            --primary-hover: #0284c7;
        }

        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background: linear-gradient(145deg, #e0f2fe 0%, #f0f9ff 40%, #f8fafc 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .logo-container {
            width: 60px; height: 60px;
            background: var(--primary);
            border-radius: 16px;
            display: flex; align-items: center; justify-content: center;
            color: white; font-size: 28px; font-weight: 800;
            margin-bottom: 24px;
            box-shadow: 0 8px 24px rgba(14,165,233,0.35);
        }

        .login-card {
            background: #ffffff;
            padding: 44px 40px 40px;
            border-radius: 20px;
            box-shadow: 0 4px 32px rgba(0, 0, 0, 0.08);
            width: 100%;
            max-width: 420px;
            text-align: center;
            border: 1px solid #e2e8f0;
        }

        .login-card h1 { color: #0f172a; font-size: 24px; font-weight: 700; margin-bottom: 4px; }
        .login-card .subtitulo { color: #64748b; font-size: 14px; margin-bottom: 36px; }

        .campo { text-align: left; margin-bottom: 20px; }

        .campo label {
            display: block; font-size: 14px; font-weight: 600;
            color: #334155; margin-bottom: 7px;
        }

        .campo input {
            width: 100%; padding: 12px 14px;
            border: 1.5px solid #e2e8f0; border-radius: 10px;
            font-size: 15px; color: #0f172a; background: #fff;
            transition: border-color 0.18s, box-shadow 0.18s; outline: none;
        }

        .campo input::placeholder { color: #94a3b8; }
        .campo input:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(14,165,233,0.13); }

        .btn-ingresar {
            width: 100%; background: var(--primary); color: white;
            border: none; padding: 14px; border-radius: 10px;
            font-size: 15px; font-weight: 600; cursor: pointer;
            transition: background 0.18s, transform 0.12s; margin-top: 8px;
        }

        .btn-ingresar:hover { background: var(--primary-hover); }
        .btn-ingresar:active { transform: scale(0.99); }

        .mensaje {
            padding: 11px 14px; border-radius: 10px;
            margin-bottom: 18px; font-size: 14px; font-weight: 500;
            text-align: left;
        }

        .mensaje-error { background-color: #fef2f2; color: #dc2626; border: 1px solid #fecaca; }
        .mensaje-exito { background-color: #f0fdf4; color: #16a34a; border: 1px solid #bbf7d0; }

        .pie-seguridad {
            margin-top: 28px; font-size: 13px; color: #94a3b8;
            display: flex; align-items: center; justify-content: center; gap: 6px;
        }

        @media (max-width: 480px) {
            .login-card {
                padding: 28px 20px 24px;
            }
            .login-card h1 {
                font-size: 20px;
            }
            .login-card .subtitulo {
                margin-bottom: 24px;
                font-size: 13px;
            }
        }
    </style>
</head>
<body>
    <div class="logo-container">U</div>
    <div class="login-card">
        <h1>Importadora Uziel</h1>
        <p class="subtitulo">Sistema de Gestión Empresarial</p>
        {% with messages = get_flashed_messages(with_categories=true) %}
          {% if messages %}
            {% for category, message in messages %}
              <div class="mensaje {% if category == 'exito' %}mensaje-exito{% else %}mensaje-error{% endif %}">{{ message }}</div>
            {% endfor %}
          {% endif %}
        {% endwith %}
        <form method="POST" autocomplete="on">
            <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
            <div class="campo">
                <label for="username">Usuario</label>
                <input type="text" id="username" name="username" placeholder="admin" autocomplete="username" required autofocus>
            </div>
            <div class="campo">
                <label for="password">Contraseña</label>
                <input type="password" id="password" name="password" placeholder="••••••••" autocomplete="current-password" required>
            </div>
            <button type="submit" class="btn-ingresar">Ingresar al Sistema</button>
        </form>
        <p style="margin-top:20px;font-size:13px;">
            <a href="{{ url_for('recuperar') }}" style="color:#64748b;text-decoration:none;transition:color 0.15s;"
               onmouseover="this.style.color='#0ea5e9'" onmouseout="this.style.color='#64748b'">
                ¿Olvidaste tu contraseña?
            </a>
        </p>
    </div>
    <p class="pie-seguridad"> Acceso restringido a personal autorizado</p>
</body>
</html>
