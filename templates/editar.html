{% extends "base.html" %}
{% block title %}Editar Producto — Importadora Uziel{% endblock %}
{% block head_extra %}
<style>
    .form-control[readonly] { background: var(--bg); color: var(--text-muted); cursor: not-allowed; }
</style>
{% endblock %}
{% block content %}
<div class="page-header">
    <div>
        <h1>Editar Producto</h1>
        <p class="subtitulo">Modifica los datos del repuesto seleccionado</p>
    </div>
</div>

<div class="form-card">
    <form method="POST">
        <div class="form-group">
            <label>Código SKU (Identificador)</label>
            <input type="text" class="form-control" value="{{ producto[0] }}" readonly>
            <p style="font-size:12px;color:var(--text-muted);margin-top:5px;">El SKU es el identificador único y no puede modificarse.</p>
        </div>
        <div class="form-group">
            <label>Nombre de la Pieza</label>
            <input type="text" name="nombre" class="form-control" value="{{ producto[1] }}" required placeholder="Nombre descriptivo">
        </div>
        <div class="form-group">
            <label>Descripción Técnica</label>
            <input type="text" name="descripcion" class="form-control" value="{{ producto[2] }}" required placeholder="Descripción del repuesto">
        </div>
        <div class="form-group">
            <label>Marca</label>
            <input type="text" name="marca" class="form-control" value="{{ producto[3] }}" required placeholder="Fabricante o marca">
        </div>
        <div class="form-group">
            <label>Compatibilidad (Vehículos)</label>
            <input type="text" name="compatibilidad" class="form-control" value="{{ producto[4] }}" required placeholder="Ej: Corsa 2005-2010, Aveo 2008-2012">
        </div>
        <div class="form-group">
            <label>Precio Corporativo ($)</label>
            <input type="number" step="0.01" name="precio" class="form-control" value="{{ producto[5] }}" required placeholder="0.00">
        </div>
        <div class="form-actions">
            <button type="submit" class="btn btn-primary"> Guardar Cambios</button>
            <a href="{{ url_for('catalogo') }}" class="btn btn-ghost">Cancelar</a>
        </div>
    </form>
</div>
{% endblock %}
